apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ICOS-metrics-export.fullname" . }}-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ICOS-metrics-export.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
