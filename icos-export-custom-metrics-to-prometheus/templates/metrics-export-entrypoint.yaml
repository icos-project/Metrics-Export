apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-export-entrypoint
  namespace: {{ .Release.Namespace }}
data:
  entrypoint.sh: |
    #!/bin/sh

    echo "⏳ Waiting for Grafana API Key Job to complete..."
    TIMEOUT=600  # 10 minutes
    ELAPSED=0

    API_SERVER="https://kubernetes.default.svc"
    NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
    TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

    while true; do
      echo "🔍 Checking Job status in namespace: $NAMESPACE"

      RESPONSE=$(curl -sS --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" \
        "$API_SERVER/apis/batch/v1/namespaces/$NAMESPACE/jobs/grafana-api-key-job")

      # Look for indication of successful job
      if echo "$RESPONSE" | grep -q '"type": *"Complete"' && echo "$RESPONSE" | grep -q '"status": *"True"'; then
        echo "✅ Grafana API Key Job has completed successfully!"
        break
      fi

      echo "🔄 Job not completed yet. Retrying in 10 seconds... ($ELAPSED/$TIMEOUT)"
      sleep 10
      ELAPSED=$((ELAPSED + 10))

      if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
        echo "❌ Timeout: Grafana API Key Job did not complete after 10 minutes. Exiting."
        exit 1
      fi
    done

    echo "🚀 Starting main application..."
    exec "$@"
