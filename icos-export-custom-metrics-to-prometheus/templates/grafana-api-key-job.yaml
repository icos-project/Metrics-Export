apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-api-key-job
  namespace: {{ .Release.Namespace }}  # Dynamically set namespace
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
spec:
  ttlSecondsAfterFinished: null
  template:
    spec:
      serviceAccountName: {{ include "ICOS-metrics-export.fullname" . }}-sa
      restartPolicy: Never
      containers:
        - name: generate-api-key
          image: bitnami/kubectl:latest
          command: ["sh", "-c"]
          args:
            - |
              echo "✅ Using pre-installed kubectl:"
              kubectl version --client

              echo "📌 Waiting for Grafana secret..."
              echo "kubectl get secret --namespace {{ .Release.Namespace }} {{ tpl .Values.grafana.secretName . }}"
              
              while true; do
                SECRET_RESULT=$(kubectl get secret --namespace {{ .Release.Namespace }} {{ tpl .Values.grafana.secretName . }} 2>&1)  # Capture output & errors
                if echo "$SECRET_RESULT" | grep -q "{{ tpl .Values.grafana.secretName . }}"; then
                  echo "✅ Grafana secret found!"
                  break
                else
                  echo "🔄 Secret not found. Retrying in 10 seconds..."
                  echo "🔎 Output: $SECRET_RESULT"
                  sleep 10
                fi
              done
              
              echo "📌 Waiting for Grafana to be fully ready..."
              
              TIMEOUT=600  # 10 minutes
              ELAPSED=0
              
              while true; do
                # Get Grafana pod name dynamically
                GRAFANA_POD=$(kubectl get pods -n {{ .Release.Namespace }} -l app.kubernetes.io/name=grafana -o jsonpath="{.items[0].metadata.name}" 2>/dev/null)

                if [ -z "$GRAFANA_POD" ]; then
                  echo "🔄 Grafana Pod not found. Retrying in 10 seconds..."
                else
                  STATUS=$(kubectl get pod "$GRAFANA_POD" -n {{ .Release.Namespace }} -o jsonpath="{.status.phase}")
                  READY_CONTAINERS=$(kubectl get pod "$GRAFANA_POD" -n {{ .Release.Namespace }} -o jsonpath="{.status.containerStatuses[*].ready}" | grep -c "true")

                  if [ "$STATUS" = "Running" ] && [ "$READY_CONTAINERS" -gt 0 ]; then
                    echo "✅ Grafana is running and ready!"
                    break
                  else
                    echo "🔄 Grafana is still initializing. STATUS: $STATUS, READY CONTAINERS: $READY_CONTAINERS. Retrying in 10 seconds..."
                  fi
                fi

                sleep 10
                ELAPSED=$((ELAPSED + 10))
              
                if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                  echo "❌ Timeout reached. Grafana did not become ready after 10 minutes. Exiting."
                  exit 1
                fi
              done
              
              # Fetch existing API keys
              echo "🔎 Checking for existing Grafana API Key..."
              EXISTING_KEYS=$(kubectl get secret --namespace {{ .Release.Namespace }} grafana-api-export-metrics-key -o jsonpath="{.data.api_key}" | base64 -d 2>/dev/null || echo "")

              if [ -n "$EXISTING_KEYS" ]; then
                echo "✅ Found existing API Key. No need to create a new one."
                exit 0
              fi

              echo "ℹ️ No existing API key found. Creating a new one..."

              echo "🔑 Retrieving Grafana Admin Password..."
              ADMIN_PASSWORD=$(kubectl get secret --namespace {{ .Release.Namespace }} {{ tpl .Values.grafana.secretName . }} -o jsonpath="{.data.password}" | base64 -d)

              if [ -z "$ADMIN_PASSWORD" ]; then
                echo "❌ Failed to retrieve Grafana admin password!"
                exit 1
              fi
              echo "✅ Admin password retrieved successfully."

              # Define variables
              GRAFANA_URL="{{ tpl .Values.GRAFANA_API_BASE_URL . }}"
              GRAFANA_URL="${GRAFANA_URL%/}"
              ADMIN_USER="admin"

              echo "🌐 GRAFANA_URL: $GRAFANA_URL"
              echo "👤 ADMIN_USER: $ADMIN_USER"

              # Retry API Key Creation for 5 minutes
              TIMEOUT=600  # 10 minutes
              ELAPSED=0
              
              while true; do
                API_KEY=$(kubectl exec -n {{ .Release.Namespace }} deployment/{{ .Release.Name }}-grafana -- curl -s -X POST "$GRAFANA_URL/api/auth/keys" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Basic $(echo -n "$ADMIN_USER:$ADMIN_PASSWORD" | base64)" \
                  -d '{"name":"grafana-api-export-metrics-key","role":"Admin"}' | jq -r .key)

                if [ -n "$API_KEY" ] && [ "$API_KEY" != "null" ]; then
                  echo "✅ API Key generated successfully: $API_KEY"
                  break
                else
                  echo "❌ Failed to create API Key. Retrying in 10 seconds..."
                  sleep 10
                  ELAPSED=$((ELAPSED + 10))

                  if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                    echo "❌ Timeout reached. Could not create API Key after 5 minutes. Exiting."
                    exit 1
                  fi
                fi
              done

              # Store the API Key in a Kubernetes Secret
              echo "🗝️ Storing API Key in Kubernetes Secret..."
              kubectl create secret generic grafana-api-export-metrics-key --from-literal=api_key="$API_KEY" -n {{ .Release.Namespace }} --dry-run=client -o yaml | kubectl apply -f -

              echo "✅ Secret created successfully."
              exit 0
