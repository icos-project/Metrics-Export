apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-api-key-job
  namespace: {{ .Release.Namespace }}  # Dynamically set namespace
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
spec:
  ttlSecondsAfterFinished: 600000
  template:
    spec:
      serviceAccountName: {{ include "ICOS-metrics-export.fullname" . }}-sa
      restartPolicy: Never
      containers:
        - name: generate-api-key
          image: bitnami/kubectl:latest
          command: ["sh", "-c"]
          args:
            - |
              echo "✅ Using pre-installed kubectl:"
              kubectl version --client

              echo "📌 Waiting for Grafana secret..."
              while ! kubectl get secret --namespace {{ .Release.Namespace }} {{ tpl .Values.grafana.secretName . }} &>/dev/null; do
                echo "Grafana secret not found. Retrying in 10 seconds..."
                sleep 10
              done
              echo "✅ Grafana secret found!"

              echo "🔑 Retrieving Grafana Admin Password..."
              ADMIN_PASSWORD=$(kubectl get secret --namespace {{ .Release.Namespace }} {{ tpl .Values.grafana.secretName . }} -o jsonpath="{.data.password}" | base64 -d)

              if [ -z "$ADMIN_PASSWORD" ]; then
                echo "❌ Failed to retrieve Grafana admin password!"
                exit 1
              fi
              echo "✅ Admin password retrieved successfully."

              # Define variables
              GRAFANA_URL="{{ tpl .Values.GRAFANA_API_BASE_URL . }}"
              GRAFANA_URL="${GRAFANA_URL%/}"
              ADMIN_USER="admin"

              echo "🌐 GRAFANA_URL: $GRAFANA_URL"
              echo "👤 ADMIN_USER: $ADMIN_USER"

              # Fetch existing API keys
              echo "🔎 Checking for existing Grafana API Key..."
              EXISTING_KEYS=$(kubectl get secret --namespace {{ .Release.Namespace }} grafana-api-export-metrics-key -o jsonpath="{.data.api_key}" | base64 -d 2>/dev/null || echo "")

              if [ -n "$EXISTING_KEYS" ]; then
                echo "✅ Found existing API Key. No need to create a new one."
                exit 0
              fi

              echo "ℹ️ No existing API key found. Creating a new one..."

              # Use `kubectl proxy` to interact with Grafana API securely
              kubectl proxy --port=8080 &
              sleep 5  # Give time for proxy to start

              # Generate new Grafana API Key
              API_KEY=$(kubectl exec -n {{ .Release.Namespace }} deployment/test2-grafana -- curl -s -X POST "$GRAFANA_URL/api/auth/keys" \
                -H "Content-Type: application/json" \
                -H "Authorization: Basic $(echo -n "$ADMIN_USER:$ADMIN_PASSWORD" | base64)" \
                -d '{"name":"grafana-api-export-metrics-key","role":"Admin"}' | jq -r .key)

              if [ -z "$API_KEY" ] || [ "$API_KEY" = "null" ]; then
                echo "❌ Failed to create API Key!"
                exit 1
              else
                echo "✅ API Key generated successfully."
              fi

              # Store the API Key in a Kubernetes Secret
              echo "🗝️ Storing API Key in Kubernetes Secret..."
              kubectl create secret generic grafana-api-export-metrics-key --from-literal=api_key="$API_KEY" -n {{ .Release.Namespace }} --dry-run=client -o yaml | kubectl apply -f -

              echo "✅ Secret created successfully."
              exit 0
