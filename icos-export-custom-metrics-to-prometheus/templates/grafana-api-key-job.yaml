apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-api-key-job
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "ICOS-metrics-export.fullname" . }}-sa
      containers:
          - name: generate-api-key
            image: bitnami/kubectl:latest
            command: [ "sh", "-c" ]
            args:
              - |
                echo "✅ Using pre-installed kubectl..."
                kubectl version --client
                
                echo "📌 Waiting for Grafana secret..."
                until kubectl get secret -n {{ .Release.Namespace }} {{ tpl .Values.grafana.secretName . }}; do
                  echo "⏳ Waiting for Grafana secret..."
                  sleep 5
                done
                
                echo "📌 Waiting for Grafana pod to be ready..."
                until [ "$(kubectl get pod -n {{ .Release.Namespace }} -l app.kubernetes.io/name=grafana -o jsonpath='{.items[0].status.phase}')" = "Running" ]; do
                  echo "⏳ Waiting for Grafana pod..."
                  sleep 5
                done
                
                GRAFANA_POD=$(kubectl get pods -n {{ .Release.Namespace }} -l app.kubernetes.io/name=grafana -o jsonpath="{.items[0].metadata.name}")
                echo "📌 Using Grafana pod: $GRAFANA_POD"
                
                ADMIN_USER="admin"
                ADMIN_PASSWORD=$(kubectl get secret -n {{ .Release.Namespace }} {{ tpl .Values.grafana.secretName . }} -o jsonpath="{.data.password}" | base64 -d)
                GRAFANA_URL="http://{{ .Release.Name }}-grafana:3000"
                AUTH=$(echo -n "$ADMIN_USER:$ADMIN_PASSWORD" | base64)
                                
                echo "🔍 Checking for existing API Key..."
                EXISTING_KEY=$(kubectl exec -n {{ .Release.Namespace }} "$GRAFANA_POD" -- \
                  curl -s -H "Authorization: Basic $(echo -n "$ADMIN_USER:$ADMIN_PASSWORD" | base64)" \
                  "$GRAFANA_URL/api/auth/keys")
                
                if echo "$EXISTING_KEY" | grep -q "grafana-api-export-metrics-key"; then
                  echo "✅ Existing API Key found."
                  
                  # Check if secret exists
                  if ! kubectl get secret -n "$NAMESPACE" grafana-api-export-metrics-key >/dev/null 2>&1; then
                    echo "🔍 Secret does not exist. Checking for existing Grafana API key with the same name..."
                
                    # Get all API keys from Grafana
                    RAW_KEYS=$(kubectl exec -n {{ .Release.Namespace }} "$GRAFANA_POD" -- \
                      curl -s -X GET "$GRAFANA_URL/api/auth/keys" \
                      -H "Authorization: Basic $AUTH")
                
                    # Find ID of API key with matching name
                    KEY_ID=$(echo "$RAW_KEYS" | grep -o '{[^}]*"name":"grafana-api-export-metrics-key"[^}]*}' | grep -o '"id":[0-9]*' | head -1 | cut -d':' -f2)
                    
                    if [ -n "$KEY_ID" ]; then
                      echo "🧹 Deleting existing Grafana API Key with ID: $KEY_ID"
                      kubectl exec -n {{ .Release.Namespace }} "$GRAFANA_POD" -- \
                        curl -s -X DELETE "$GRAFANA_URL/api/auth/keys/$KEY_ID" \
                        -H "Authorization: Basic $AUTH"
                    fi
                
                    echo "🔑 Creating new API Key..."
                    API_KEY=$(kubectl exec -n {{ .Release.Namespace }} "$GRAFANA_POD" -- \
                      curl -s -X POST "$GRAFANA_URL/api/auth/keys" \
                      -H "Content-Type: application/json" \
                      -H "Authorization: Basic $(echo -n "$ADMIN_USER:$ADMIN_PASSWORD" | base64)" \
                      -d '{"name":"grafana-api-export-metrics-key","role":"Admin"}' | grep -o '"key":"[^"]*"' | sed 's/"key":"\(.*\)"/\1/')
                
                    if [ -n "$API_KEY" ]; then
                      echo "🗝️ Storing API Key in Secret..."
                      kubectl create secret generic grafana-api-export-metrics-key \
                        --from-literal=api_key="$API_KEY" \
                        -n {{ .Release.Namespace }} \
                        --dry-run=client -o yaml | kubectl apply -f -
                      echo "✅ Secret created successfully."
                    else
                      echo "❌ Failed to create API Key."
                      exit 1
                    fi
                  else
                    echo "✅ Secret already exists. Skipping API key generation."
                  fi
                  
                  exit 0
                else
                  echo "🔑 Creating new API Key..."
                  API_KEY=$(kubectl exec -n {{ .Release.Namespace }} "$GRAFANA_POD" -- \
                    curl -s -X POST "$GRAFANA_URL/api/auth/keys" \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Basic $(echo -n "$ADMIN_USER:$ADMIN_PASSWORD" | base64)" \
                    -d '{"name":"grafana-api-export-metrics-key","role":"Admin"}' | grep -o '"key":"[^"]*"' | sed 's/"key":"\(.*\)"/\1/')
              
                  if [ -n "$API_KEY" ]; then
                    echo "🗝️ Storing API Key in Secret..."
                    kubectl create secret generic grafana-api-export-metrics-key \
                      --from-literal=api_key="$API_KEY" \
                      -n {{ .Release.Namespace }} \
                      --dry-run=client -o yaml | kubectl apply -f -
                    echo "✅ Secret created successfully."
                  else
                    echo "❌ Failed to create a new API Key."
                    exit 1
                  fi
                fi
