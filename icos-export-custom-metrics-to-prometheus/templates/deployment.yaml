apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ICOS-metrics-export.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "ICOS-metrics-export.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "ICOS-metrics-export.fullname" . }}
    spec:
      {{- with .Values.imagePullSecrets | default .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if (tpl .Values.extraCertsBundle.configmapName .) }}
      volumes:
        - configMap:
            name: {{ tpl .Values.extraCertsBundle.configmapName . }}
          name: extra-certs-bundle
        - emptyDir: {}
          name: tmp
      {{- end }}

      initContainers:
      {{- if (tpl .Values.extraCertsBundle.configmapName .) }}
        - args:
            - update-ca-certificates && cp -r /etc/ssl/certs/ca-certificates.crt /output/
          command:
            - /bin/sh
            - -c
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          name: init-ca-certs
          volumeMounts:
            - mountPath: /usr/local/share/ca-certificates/icos-extra-certs.crt
              name: extra-certs-bundle
              subPath: {{ tpl .Values.extraCertsBundle.configmapKey . }}
            - mountPath: /output
              name: tmp
              readOnly: false
      {{- end }}
        - name: wait-for-grafana-secret
          image: busybox
          command: [ "sh", "-c" ]
          args:
            - |
              TIMEOUT=900  # Set a timeout (e.g., 900 seconds = 15 minutes)
              ELAPSED=0
              echo "Waiting for Grafana API key secret..."
              ReleaseNamespace="{{ .Release.Namespace }}"
              echo "Release Namespace: ${ReleaseNamespace}"
              
              condition="! kubectl get secret grafana-api-export-metrics-key -n {{ .Release.Namespace }}"
              echo "condition: ${condition}"
              
              while ! kubectl get secret grafana-api-export-metrics-key -n {{ .Release.Namespace }}; do
                echo "Secret not found. Retrying in 5s..."
                sleep 5
                ELAPSED=$((ELAPSED+5))
                if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                  echo "❌ Timeout reached while waiting for the secret. Exiting."
                  exit 1  # Fail the deployment if the secret is missing
                fi
              done
              echo "✅ Secret found. Proceeding..."

      containers:
        - name: {{ include "ICOS-metrics-export.fullname" . }}
          image: "{{ .Values.image.repository  }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-icos-metrics-export-config
          env:
            - name: GRAFANA_SERVICE_ACCOUNT_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-api-export-metrics-key
                  key: api_key
          volumeMounts:
      {{- if (tpl .Values.extraCertsBundle.configmapName .) }}
            - mountPath: /etc/ssl/certs/icos-extra-certs.crt
              name: extra-certs-bundle
              subPath: {{ tpl .Values.extraCertsBundle.configmapKey . }}
            - mountPath: /etc/ssl/certs/ca-certificates.crt
              name: tmp
              subPath: ca-certificates.crt
      {{- end }}
